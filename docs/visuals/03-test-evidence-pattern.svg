<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="455" viewBox="0 0 680 455" role="img"><title>Test job evidence pattern</title><desc>pytest runs with continue-on-error so the job continues. Publish, upload and summary steps run unless the run was cancelled, keeping evidence on pass or fail. The last step fails the job if pytest failed.</desc><style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#1f2328}
.th{font-size:14px;font-weight:600;fill:#1f2328}
.ts{font-size:12px;fill:#59636e}
.arr{stroke:#59636e;stroke-width:1.5;fill:none}
.leader{stroke:#8c959f;stroke-width:0.75;stroke-dasharray:3 3;fill:none}
.dash{stroke:#8c959f}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}.t,.th{fill:#e6edf3}.ts{fill:#9198a1}.arr{stroke:#9198a1}.leader,.dash{stroke:#6e7681}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>.th{fill:#FAEEDA}.c-amber>.ts{fill:#FAC775}
.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#F1EFE8}.c-gray>.ts{fill:#D3D1C7}}
</style><rect class="bg" x="0" y="0" width="680" height="455"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="60" y="20" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="210" y="38" text-anchor="middle" dominant-baseline="central">Run pytest</text><text class="ts" x="210" y="58" text-anchor="middle" dominant-baseline="central">continue-on-error: true</text></g>
<line x1="210" y1="76" x2="210" y2="98" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="100" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="210" y="118" text-anchor="middle" dominant-baseline="central">Publish test results</text><text class="ts" x="210" y="138" text-anchor="middle" dominant-baseline="central">Check run + annotations</text></g>
<line x1="210" y1="156" x2="210" y2="178" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="180" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="210" y="198" text-anchor="middle" dominant-baseline="central">Upload test reports</text><text class="ts" x="210" y="218" text-anchor="middle" dominant-baseline="central">junit.xml + report.html</text></g>
<line x1="210" y1="236" x2="210" y2="258" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="260" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="210" y="278" text-anchor="middle" dominant-baseline="central">Link in run summary</text><text class="ts" x="210" y="298" text-anchor="middle" dominant-baseline="central">Artifact URL on the run page</text></g>
<line x1="210" y1="316" x2="210" y2="338" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="60" y="340" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="210" y="358" text-anchor="middle" dominant-baseline="central">Fail if tests failed</text><text class="ts" x="210" y="378" text-anchor="middle" dominant-baseline="central">steps.pytest.outcome == failure</text></g>
<line x1="360" y1="48" x2="408" y2="48" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="410" y="26" width="230" height="44" rx="8" stroke-width="0.5"/><text class="ts" x="525" y="48" text-anchor="middle" dominant-baseline="central">Outcome saved, job keeps going</text></g>
<line class="leader" x1="360" y1="128" x2="410" y2="128"/>
<line class="leader" x1="360" y1="208" x2="410" y2="208"/>
<line class="leader" x1="360" y1="288" x2="410" y2="288"/>
<g class="c-gray"><rect x="410" y="106" width="230" height="204" rx="8" stroke-width="0.5"/><text class="th" x="525" y="190" text-anchor="middle" dominant-baseline="central">if: !cancelled()</text><text class="ts" x="525" y="212" text-anchor="middle" dominant-baseline="central">Runs on pass or fail,</text><text class="ts" x="525" y="230" text-anchor="middle" dominant-baseline="central">so evidence is always kept</text></g>
<line x1="360" y1="368" x2="408" y2="368" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="410" y="340" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="525" y="358" text-anchor="middle" dominant-baseline="central">Yes: exit 1, job red</text><text class="ts" x="525" y="378" text-anchor="middle" dominant-baseline="central">No: job ends green</text></g>
<text class="ts" x="340" y="432" text-anchor="middle">Evidence first, verdict last: a failed run still leaves a complete record</text>
</svg>
