<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="495" viewBox="0 0 680 495" role="img"><title>ci-cd.yml v4 overall flow</title><desc>Left: a push runs build, then test and scan in parallel, then checks whether the branch is main; if so, deploy-staging runs. Right: a manual Run workflow with promote_to_production passes gate 1 (staging passed for this SHA) and gate 2 (image exists), then deploy-prod and smoke test.</desc><style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#1f2328}
.th{font-size:14px;font-weight:600;fill:#1f2328}
.ts{font-size:12px;fill:#59636e}
.arr{stroke:#59636e;stroke-width:1.5;fill:none}
.leader{stroke:#8c959f;stroke-width:0.75;stroke-dasharray:3 3;fill:none}
.dash{stroke:#8c959f}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}.t,.th{fill:#e6edf3}.ts{fill:#9198a1}.arr{stroke:#9198a1}.leader,.dash{stroke:#6e7681}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>.th{fill:#FAEEDA}.c-amber>.ts{fill:#FAC775}
.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#F1EFE8}.c-gray>.ts{fill:#D3D1C7}}
</style><rect class="bg" x="0" y="0" width="680" height="495"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="60" y="20" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="38" text-anchor="middle" dominant-baseline="central">Push</text><text class="ts" x="170" y="58" text-anchor="middle" dominant-baseline="central">main, dev-*, fix-*</text></g>
<g class="c-amber"><rect x="400" y="20" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="38" text-anchor="middle" dominant-baseline="central">Run workflow (manual)</text><text class="ts" x="510" y="58" text-anchor="middle" dominant-baseline="central">main + promote_to_production</text></g>
<line x1="170" y1="76" x2="170" y2="108" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="110" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="128" text-anchor="middle" dominant-baseline="central">build</text><text class="ts" x="170" y="148" text-anchor="middle" dominant-baseline="central">Runtime + test images</text></g>
<path d="M170 166 L170 182 L110 182 L110 198" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M170 182 L230 182 L230 198" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="200" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="218" text-anchor="middle" dominant-baseline="central">test</text><text class="ts" x="110" y="238" text-anchor="middle" dominant-baseline="central">pytest</text></g>
<g class="c-purple"><rect x="180" y="200" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="230" y="218" text-anchor="middle" dominant-baseline="central">scan</text><text class="ts" x="230" y="238" text-anchor="middle" dominant-baseline="central">Trivy</text></g>
<path d="M110 256 L110 272 L170 272 L170 288" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M230 256 L230 272 L170 272" fill="none" class="arr"/>
<g class="c-gray"><rect x="60" y="290" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="308" text-anchor="middle" dominant-baseline="central">On main?</text><text class="ts" x="170" y="328" text-anchor="middle" dominant-baseline="central">No: CI only, run ends</text></g>
<line x1="170" y1="346" x2="170" y2="378" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="178" y="364">yes</text>
<g class="c-teal"><rect x="60" y="380" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="398" text-anchor="middle" dominant-baseline="central">deploy-staging</text><text class="ts" x="170" y="418" text-anchor="middle" dominant-baseline="central">Deploy + smoke test</text></g>
<line x1="510" y1="76" x2="510" y2="108" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="400" y="110" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="128" text-anchor="middle" dominant-baseline="central">Gate 1: staging passed?</text><text class="ts" x="510" y="148" text-anchor="middle" dominant-baseline="central">Checks API, same SHA</text></g>
<line x1="510" y1="166" x2="510" y2="198" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="400" y="200" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="218" text-anchor="middle" dominant-baseline="central">Gate 2: image exists?</text><text class="ts" x="510" y="238" text-anchor="middle" dominant-baseline="central">GHCR manifest lookup</text></g>
<line x1="510" y1="256" x2="510" y2="288" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="400" y="290" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="308" text-anchor="middle" dominant-baseline="central">deploy-prod</text><text class="ts" x="510" y="328" text-anchor="middle" dominant-baseline="central">Same image, no rebuild</text></g>
<line x1="510" y1="346" x2="510" y2="378" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="400" y="380" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="398" text-anchor="middle" dominant-baseline="central">Smoke test + record</text><text class="ts" x="510" y="418" text-anchor="middle" dominant-baseline="central">/health, audit summary</text></g>
<line x1="282" y1="404" x2="398" y2="142" class="dash" stroke-width="0.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="470" text-anchor="middle">Purple = CI, teal = CD, amber = human trigger. Any failed job or gate stops the run.</text>
</svg>
