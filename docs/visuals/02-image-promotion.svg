<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="395" viewBox="0 0 680 395" role="img"><title>Build once, promote many: images in GHCR</title><desc>The build job pushes a runtime image and a test image, both tagged with the commit SHA, into the GHCR registry. The test job pulls the test image. Scan, deploy-staging and deploy-prod all use the same runtime image.</desc><style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#1f2328}
.th{font-size:14px;font-weight:600;fill:#1f2328}
.ts{font-size:12px;fill:#59636e}
.arr{stroke:#59636e;stroke-width:1.5;fill:none}
.leader{stroke:#8c959f;stroke-width:0.75;stroke-dasharray:3 3;fill:none}
.dash{stroke:#8c959f}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}.t,.th{fill:#e6edf3}.ts{fill:#9198a1}.arr{stroke:#9198a1}.leader,.dash{stroke:#6e7681}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>.th{fill:#FAEEDA}.c-amber>.ts{fill:#FAC775}
.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#F1EFE8}.c-gray>.ts{fill:#D3D1C7}}
</style><rect class="bg" x="0" y="0" width="680" height="395"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="40" y="160" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="178" text-anchor="middle" dominant-baseline="central">build</text><text class="ts" x="100" y="198" text-anchor="middle" dominant-baseline="central">Pushes both</text></g>
<rect x="210" y="60" width="200" height="240" rx="12" fill="none" class="dash" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="310" y="86" text-anchor="middle">GHCR registry</text>
<g class="c-teal"><rect x="230" y="110" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="310" y="128" text-anchor="middle" dominant-baseline="central">Runtime image</text><text class="ts" x="310" y="148" text-anchor="middle" dominant-baseline="central">:3f9c1e2 + SBOM</text></g>
<g class="c-purple"><rect x="230" y="210" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="310" y="228" text-anchor="middle" dominant-baseline="central">Test image</text><text class="ts" x="310" y="248" text-anchor="middle" dominant-baseline="central">:3f9c1e2-test</text></g>
<line x1="160" y1="178" x2="228" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="200" x2="228" y2="236" class="arr" marker-end="url(#arrow)"/>
<line x1="390" y1="134" x2="468" y2="84" class="arr" marker-end="url(#arrow)"/>
<line x1="390" y1="138" x2="468" y2="152" class="arr" marker-end="url(#arrow)"/>
<line x1="390" y1="142" x2="468" y2="220" class="arr" marker-end="url(#arrow)"/>
<line x1="390" y1="240" x2="468" y2="290" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="470" y="60" width="170" height="44" rx="8" stroke-width="0.5"/><text class="th" x="555" y="82" text-anchor="middle" dominant-baseline="central">scan: Trivy</text></g>
<g class="c-teal"><rect x="470" y="130" width="170" height="44" rx="8" stroke-width="0.5"/><text class="th" x="555" y="152" text-anchor="middle" dominant-baseline="central">deploy-staging</text></g>
<g class="c-teal"><rect x="470" y="200" width="170" height="44" rx="8" stroke-width="0.5"/><text class="th" x="555" y="222" text-anchor="middle" dominant-baseline="central">deploy-prod</text></g>
<g class="c-purple"><rect x="470" y="270" width="170" height="44" rx="8" stroke-width="0.5"/><text class="th" x="555" y="292" text-anchor="middle" dominant-baseline="central">test: pytest</text></g>
<text class="ts" x="340" y="345" text-anchor="middle">Same tag everywhere: what passed scan and staging is exactly what ships</text>
<text class="ts" x="340" y="367" text-anchor="middle">Rollback = redeploy the previous SHA tag. Test tooling never reaches production.</text>
</svg>
