name: ci-cd

on:
  push:
    branches:
      - main
      - "dev-*"
      - "fix-*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.image }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          sbom: true
          provenance: true

          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create results directory
        run: mkdir -p test-results

      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD/test-results:/results" \
            "${{ needs.build.outputs.image }}" \
            pytest \
            -q \
            --junitxml=/results/junit.xml \
            --html=/results/report.html \
            --self-contained-html

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-results/
          retention-days: 30

      - name: Fail if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  publish-test-report:
    needs: test
    if: always()

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Add report summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REPORT_URL="${{ steps.deploy.outputs.page_url }}/report.html"

          ARTIFACT_ID=$(gh api \
            repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts \
            --jq '.artifacts[] | select(.name=="test-reports") | .id' \
            | head -1)

          ARTIFACT_URL="https://github.com/${GITHUB\_REPOSITORY}/actions/runs/${GITHUB\_RUN\_ID}/artifacts/${ARTIFACT\_ID}"

          {
            echo "## Test Reports"
            echo
            echo "- 🌐 ${REPORT_URL}"
            echo "- 🔧 ${RUN_URL}"
            echo "- 📦 ${ARTIFACT_URL}"
            echo
            echo "### Included Reports"
            echo
            echo "- 📄 report.html (pytest-html)"
            echo "- 📊 junit.xml (JUnit)"
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker pull "${{ needs.build.outputs.image }}"

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0 \
            image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            "${{ needs.build.outputs.image }}"

  deploy-staging:
    needs:
      - build
      - test
      - scan

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: staging

    steps:
      - uses: actions/checkout@v4

      - run: |
          ./scripts/deploy.sh \
            staging \
            "${{ needs.build.outputs.image }}"

  deploy-prod:
    needs:
      - build
      - deploy-staging

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      success()

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: production

    steps:
      - uses: actions/checkout@v4

      - run: |
          ./scripts/deploy.sh \
            production \
            "${{ needs.build.outputs.image }}"
